# Render Blueprint for a *temporary* deploy (friends-and-family testing,
# not a production launch — see DEPLOYMENT.md for what a real launch
# still needs). Deploys three things together: a free Postgres instance,
# the NestJS API, and the Next.js web app.
#
# This file was hand-written against Render's Blueprint spec as of this
# repo's last update — it was NOT verified against a live Render account
# (this environment has no outbound network access to check), so if
# Render's dashboard flags a schema error on import, treat that error
# message as more current than this comment and fix the field name it
# points at. Everything else here (build/start commands, env var names,
# ports) is verified directly against this repo's own package.json
# scripts and .env.example files.
#
# How to use: Render dashboard → New → Blueprint → connect this repo →
# Apply. Four env vars below are left as placeholders (CORS_ORIGIN,
# WEB_APP_URL, API_ORIGIN, NEXT_PUBLIC_SITE_URL) because they
# depend on the *.onrender.com URLs Render assigns, which aren't known
# until after the first deploy — fill in the real ones and redeploy once
# you have them. See the deployment instructions the assistant gave you
# for the full step-by-step.

databases:
  - name: liberia360-db
    databaseName: liberia360
    user: liberia360
    plan: free

services:
  - type: web
    name: liberia360-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Migrations run once per build (not per instance boot) — see
    # DEPLOYMENT.md's note on why that matters if this ever scales past
    # one instance. `migration:run` only applies pending migrations, so
    # re-running it on every deploy is safe.
    buildCommand: npm ci && npm run build --workspace=api && npm run migration:run --workspace=api
    startCommand: npm run start:prod --workspace=api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        fromDatabase:
          name: liberia360-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: liberia360-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: liberia360-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: liberia360-db
          property: password
      - key: DB_DATABASE
        fromDatabase:
          name: liberia360-db
          property: database
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      # Placeholder — replace with your actual web service URL, e.g.
      # https://liberia360-web.onrender.com (no trailing slash), once
      # Render assigns it after the first deploy.
      - key: CORS_ORIGIN
        value: https://REPLACE-WITH-YOUR-WEB-URL.onrender.com
      - key: WEB_APP_URL
        value: https://REPLACE-WITH-YOUR-WEB-URL.onrender.com
      # s3, not local — Render's free tier disk is ephemeral, so "local"
      # loses every uploaded photo on the next deploy (see DEPLOYMENT.md's
      # Object storage section). The S3_* values below are `sync: false`
      # on purpose: Render still provisions the env var slot so it shows
      # up in the dashboard, but leaves the value alone instead of
      # resetting it to blank on every Blueprint sync — the same reason a
      # secret like this can't just be `value:`'d here, since that would
      # mean committing real credentials to the repo. Fill in the actual
      # bucket/keys in the Render dashboard once (Environment tab on the
      # liberia360-api service) — a Blueprint sync after that won't touch
      # them again.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Only needed for a non-AWS S3-compatible endpoint (Cloudflare R2,
      # MinIO, ...) — leave blank in the dashboard for real AWS S3.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL_BASE
        sync: false
      # Unset on purpose: SMTP_HOST left blank means password-reset and
      # email-verification links are logged to the API's Render logs
      # instead of actually emailed — fine for a quick test, add real
      # SMTP_* vars in the Render dashboard if your friends need those
      # flows to work for real.

  - type: web
    name: liberia360-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=web
    startCommand: npm run start --workspace=web -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # Server-only upstream the web service's same-origin /api and
      # /uploads rewrites (next.config.js) proxy to, and that server
      # components fetch from directly — see web/.env.example. Bare
      # origin, no /api/v1 suffix and no trailing slash, e.g.
      # https://liberia360-api.onrender.com, once Render assigns it after
      # the first deploy. NEXT_PUBLIC_API_URL is gone: the browser never
      # talks to the API host directly anymore, so nothing in web/src
      # reads that variable any more.
      - key: API_ORIGIN
        value: https://REPLACE-WITH-YOUR-API-URL.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://REPLACE-WITH-YOUR-WEB-URL.onrender.com
